version: '3.8'
services:

  # Tu postgres original (intacto)
  prod:
    image: postgres:latest
    container_name: postgres_pentaho
    restart: always
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    ports:
      - '5432:5432'
    volumes:
      - postgres-volume:/var/lib/postgresql/data
      - ./source/dividido:/docker-entrypoint-initdb.d
      - ./import_data.sh:/import_data.sh
    networks:
      - postgresnet

  # App de música con AGE
  music_db:
    image: apache/age:latest
    container_name: postgres_music
    restart: always
    environment:
      POSTGRES_PASSWORD: music1234
      POSTGRES_USER: music_user
      POSTGRES_DB: music_app
    ports:
      - '5433:5432'
    volumes:
      - music-volume:/var/lib/postgresql/data
      - ./music_db/init:/docker-entrypoint-initdb.d
    networks:
      - postgresnet

networks:
  postgresnet:
    external: true

volumes:
  postgres-volume:
  music-volume:
